# Keeps the dependency and action versions from silently ageing. micronaut-parent in particular is
# the one bump that moves most of the tree, so it is worth seeing a PR for it.
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - patch
