name: Release

on:
  push:
    branches:
      - main

env:
  REGISTRY: quay.io
  REPOSITORY: seamware

# releases one after the other, each reading the tags left by the previous one
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # A push to main must not publish an image that no test ran against.
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Check code style and license
        run: mvn clean spotless:check

      - name: Run tests
        run: mvn clean verify

  # The version from the semver label of the pull request: X.Y.Z-PRE-<number> on a pull request,
  # X.Y.Z on the push of its merge. See https://github.com/FIWARE/github-workflows
  generate-version:
    uses: FIWARE/github-workflows/.github/workflows/semver-version.yml@v1
    permissions:
      contents: read
      pull-requests: write
    with:
      tag-prefix: ""

  build-and-push:
    needs: [ "test", "generate-version" ]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Login to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build&Push image
        run: |
          mvn versions:set -DnewVersion=${{ needs.generate-version.outputs.version }}
          mvn clean deploy -Poci -Dimage.tag=${{ needs.generate-version.outputs.version }} -Dimage.registry="${{ env.REGISTRY }}" -Dimage.repository="${{ env.REPOSITORY }}"

  # Publishes the release, see
  # https://github.com/FIWARE/github-workflows
  git-release:
    needs: [ "generate-version", "build-and-push" ]
    uses: FIWARE/github-workflows/.github/workflows/github-release.yml@v1
    permissions:
      contents: write
    with:
      version: ${{ needs.generate-version.outputs.version }}
      prerelease: false
      files: |
        LICENSE
