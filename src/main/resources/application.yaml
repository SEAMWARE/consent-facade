micronaut:
  application:
    name: consent-facade

  server:
    port: 8080

  metrics:
    enabled: true
    export:
      prometheus:
        step: PT2s
        descriptions: false

  # HTTP clients for the consumed TM Forum APIs
  http:
    services:
      product-order:
        path: "/tmf-api/productOrderingManagement/v4"
        url: http://localhost:8081
        read-timeout: 30
      product-catalog:
        path: "/tmf-api/productCatalogManagement/v4"
        url: http://localhost:8082
        read-timeout: 30
      product-inventory:
        path: "/tmf-api/productInventory/v4"
        url: http://localhost:8085
        read-timeout: 30
      party:
        path: "/tmf-api/party/v4"
        url: http://localhost:8083
        read-timeout: 30
      agreement:
        path: "/tmf-api/agreementManagement/v4"
        url: http://localhost:8084
        read-timeout: 30

http:
  client:
    log-exception: false
  server:
    log:
      exclude-paths:
        - /health
        - /metrics
        - /prometheus

endpoints:
  all:
    port: 9090

# facade specific configuration
facade:
  # public base url of this facade, used to build the self-description urls the contracts point back at
  self-url: http://localhost:8080
  # self-description identifiers of the two parties of a bilateral contract
  provider:
    self-description: ${facade.self-url}/participants/provider
  consumer:
    self-description: ${facade.self-url}/participants/consumer
  # TM Forum party characteristic that carries the participant did
  party:
    did-characteristic: "did"
  # provider registry (multi-provider plan, REQUIREMENTS.md §11): providerKey -> TM Forum backend.
  # A 'default' provider is required; single-provider deployments configure only this entry.
  # - tmforum-base-url: base url of that provider's TM Forum backend. The default provider still
  #   reads via the generated clients (micronaut.http.services.*); a non-default provider is read
  #   over this url.
  # - self-description (optional): the provider participant's own provider-keyed self-description
  #   URL, used as the producedBy of its data resources (§11.7). Falls back to
  #   facade.provider.self-description when unset.
  providers:
    default:
      tmforum-base-url: http://localhost:8080
  # provider-registry mode (REQUIREMENTS.md §11.8). Default (static): providers come only from the
  # facade.providers.* config above. Set persistent=true to manage providers at runtime through the
  # admin /providers API, backed by PostgreSQL (Micronaut Data JDBC). In persistent mode an empty
  # table is seeded from facade.providers.* on first start; the schema is created by the Flyway
  # migration (db/migration/V1__create_provider_table.sql). Configure a PostgreSQL datasource, e.g.:
  #   provider-registry:
  #     persistent: true
  # datasources:
  #   default:
  #     url: jdbc:postgresql://<host>:5432/<db>
  #     username: <user>
  #     password: <password>
  #     dialect: POSTGRES
  # flyway:
  #   datasources:
  #     default:
  #       enabled: true
  provider-registry:
    persistent: false
